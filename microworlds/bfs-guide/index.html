<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Micro World — BFS 거주 가이드 (루미)</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0e1320; --fg:#e9edf5; --muted:#9aa6bd;
    --panel:rgba(18,24,38,.82); --border:#2a3350;
    --undisc:#485575; --queued:#f59e0b; --current:#3b82f6; --done:#22c55e;
    --avatar:#e64980; --guide:#22d3ee; --path:#37436a; --path-hot:#f5c451;
    --terrain-a:#0f1626; --grid:#1a2540;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:var(--bg); color:var(--fg); padding:14px;
        font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; }
  h1{ font-size:16px; margin:0 0 8px; }
  .muted{ color:var(--muted); }
  .layout{ display:grid; grid-template-columns:minmax(0,1.55fr) minmax(260px,1fr); gap:14px; }
  @media(max-width:820px){ .layout{ grid-template-columns:1fr; } }
  #stage{ position:relative; height:62vh; min-height:400px; border-radius:14px;
          overflow:hidden; border:1px solid var(--border); background:var(--terrain-a); }
  #c{ display:block; width:100%; height:100%; }
  .hud{ position:absolute; background:var(--panel); border:1px solid var(--border);
        border-radius:10px; padding:7px 11px; backdrop-filter:blur(6px); font-size:12px; }
  #hud-top{ top:10px; left:10px; right:10px; }
  #legend{ bottom:10px; left:10px; display:flex; gap:10px; flex-wrap:wrap; }
  #mini{ position:absolute; bottom:10px; right:10px; width:150px; height:112px;
         border:1px solid var(--border); border-radius:8px; background:rgba(8,12,20,.6); }
  .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; vertical-align:-1px; margin-right:3px; }
  /* 채팅 */
  #chat{ display:flex; flex-direction:column; height:62vh; min-height:400px;
         border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--panel); }
  #chat header{ padding:10px 12px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
  #chat header .orb{ width:22px; height:22px; border-radius:50%; background:var(--guide);
        box-shadow:0 0 12px var(--guide); flex:0 0 auto; }
  #log{ flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg{ max-width:88%; padding:8px 11px; border-radius:12px; font-size:13px; white-space:pre-wrap; }
  .msg.guide{ align-self:flex-start; background:#12283a; border:1px solid #1d4a5e; border-bottom-left-radius:3px; }
  .msg.me{ align-self:flex-end; background:#3a1f2e; border:1px solid #6e2f47; border-bottom-right-radius:3px; }
  #chips{ display:flex; gap:6px; flex-wrap:wrap; padding:8px 10px; border-top:1px solid var(--border); }
  .chip{ font-size:12px; padding:4px 10px; border:1px solid var(--border); border-radius:999px;
         background:#152036; cursor:pointer; }
  .chip:hover{ border-color:var(--guide); }
  form{ display:flex; gap:6px; padding:10px; border-top:1px solid var(--border); }
  #q{ flex:1; padding:8px 10px; border-radius:9px; border:1px solid var(--border); background:#0f1626; color:var(--fg); font:inherit; }
  form button{ padding:8px 12px; border-radius:9px; border:1px solid var(--border); background:#152036; color:var(--fg); cursor:pointer; }
  .bar{ display:flex; align-items:center; gap:10px; margin-top:12px; }
  input[type=range]{ flex:1; accent-color:var(--current); }
  .bar button{ font:inherit; padding:6px 13px; border:1px solid var(--border); background:#182238; color:var(--fg); border-radius:9px; cursor:pointer; }
  kbd{ background:#1c2740; border:1px solid var(--border); border-radius:5px; padding:0 5px; }
</style>
</head>
<body>
<h1>🌍 BFS 거주 가이드 — <span style="color:var(--guide)">루미</span>와 함께 세계를 탐험하며 이해하기
  <span class="muted" style="font-weight:400; font-size:13px">· 이동 WASD/화살표 · 탐색재생 Space · 스텝 [ ]</span></h1>

<div class="layout">
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="hud" id="hud-top"><b id="label">—</b> <span class="muted" id="note"></span></div>
    <div class="hud" id="legend">
      <span><span class="dot" style="background:var(--undisc)"></span>미발견</span>
      <span><span class="dot" style="background:var(--queued)"></span>큐</span>
      <span><span class="dot" style="background:var(--current)"></span>현재</span>
      <span><span class="dot" style="background:var(--done)"></span>확정</span>
      <span><span class="dot" style="background:var(--avatar)"></span>나</span>
      <span><span class="dot" style="background:var(--guide)"></span>루미</span>
    </div>
    <canvas id="mini"></canvas>
  </div>

  <aside id="chat">
    <header><span class="orb"></span><b>루미</b><span class="muted">· 세계의 거주 가이드</span></header>
    <div id="log"></div>
    <div id="chips"></div>
    <form id="form"><input id="q" placeholder="루미에게 물어보기…" autocomplete="off" /><button>보내기</button></form>
  </aside>
</div>

<div class="bar">
  <button id="play">▶ 탐색 재생</button>
  <button id="stepb">⟨ 이전</button>
  <button id="stepf">다음 ⟩</button>
  <input type="range" id="slider" min="0" value="0" />
  <span id="counter" class="muted">0 / 0</span>
</div>

<script type="application/json" id="trace-data">[{"step":0,"label":"초기화","state":{"current":null,"queue":["A"],"visited":["A"],"dist":{"A":0},"edge":null},"note":"시작 노드 A 를 큐에 넣고 거리 0."},{"step":1,"label":"방문: A","state":{"current":"A","queue":[],"visited":["A"],"dist":{"A":0},"edge":null},"note":"큐 앞에서 A 를 꺼내 확정한다(거리 0)."},{"step":2,"label":"간선 검사: A–B","state":{"current":"A","queue":[],"visited":["A"],"dist":{"A":0},"edge":["A","B"]},"note":"A 의 이웃 B 를 살펴본다."},{"step":3,"label":"발견: B","state":{"current":"A","queue":["B"],"visited":["A","B"],"dist":{"A":0,"B":1},"edge":["A","B"]},"note":"B 는 처음 본다 → 거리 1, 큐에 추가."},{"step":4,"label":"간선 검사: A–C","state":{"current":"A","queue":["B"],"visited":["A","B"],"dist":{"A":0,"B":1},"edge":["A","C"]},"note":"A 의 이웃 C 를 살펴본다."},{"step":5,"label":"발견: C","state":{"current":"A","queue":["B","C"],"visited":["A","B","C"],"dist":{"A":0,"B":1,"C":1},"edge":["A","C"]},"note":"C 는 처음 본다 → 거리 1, 큐에 추가."},{"step":6,"label":"방문: B","state":{"current":"B","queue":["C"],"visited":["A","B","C"],"dist":{"A":0,"B":1,"C":1},"edge":null},"note":"큐 앞에서 B 를 꺼내 확정한다(거리 1)."},{"step":7,"label":"간선 검사: B–A","state":{"current":"B","queue":["C"],"visited":["A","B","C"],"dist":{"A":0,"B":1,"C":1},"edge":["B","A"]},"note":"B 의 이웃 A 를 살펴본다."},{"step":8,"label":"건너뜀: A","state":{"current":"B","queue":["C"],"visited":["A","B","C"],"dist":{"A":0,"B":1,"C":1},"edge":["B","A"]},"note":"A 는 이미 방문함 → 무시."},{"step":9,"label":"간선 검사: B–D","state":{"current":"B","queue":["C"],"visited":["A","B","C"],"dist":{"A":0,"B":1,"C":1},"edge":["B","D"]},"note":"B 의 이웃 D 를 살펴본다."},{"step":10,"label":"발견: D","state":{"current":"B","queue":["C","D"],"visited":["A","B","C","D"],"dist":{"A":0,"B":1,"C":1,"D":2},"edge":["B","D"]},"note":"D 는 처음 본다 → 거리 2, 큐에 추가."},{"step":11,"label":"방문: C","state":{"current":"C","queue":["D"],"visited":["A","B","C","D"],"dist":{"A":0,"B":1,"C":1,"D":2},"edge":null},"note":"큐 앞에서 C 를 꺼내 확정한다(거리 1)."},{"step":12,"label":"간선 검사: C–A","state":{"current":"C","queue":["D"],"visited":["A","B","C","D"],"dist":{"A":0,"B":1,"C":1,"D":2},"edge":["C","A"]},"note":"C 의 이웃 A 를 살펴본다."},{"step":13,"label":"건너뜀: A","state":{"current":"C","queue":["D"],"visited":["A","B","C","D"],"dist":{"A":0,"B":1,"C":1,"D":2},"edge":["C","A"]},"note":"A 는 이미 방문함 → 무시."},{"step":14,"label":"간선 검사: C–D","state":{"current":"C","queue":["D"],"visited":["A","B","C","D"],"dist":{"A":0,"B":1,"C":1,"D":2},"edge":["C","D"]},"note":"C 의 이웃 D 를 살펴본다."},{"step":15,"label":"건너뜀: D","state":{"current":"C","queue":["D"],"visited":["A","B","C","D"],"dist":{"A":0,"B":1,"C":1,"D":2},"edge":["C","D"]},"note":"D 는 이미 방문함 → 무시."},{"step":16,"label":"간선 검사: C–E","state":{"current":"C","queue":["D"],"visited":["A","B","C","D"],"dist":{"A":0,"B":1,"C":1,"D":2},"edge":["C","E"]},"note":"C 의 이웃 E 를 살펴본다."},{"step":17,"label":"발견: E","state":{"current":"C","queue":["D","E"],"visited":["A","B","C","D","E"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2},"edge":["C","E"]},"note":"E 는 처음 본다 → 거리 2, 큐에 추가."},{"step":18,"label":"방문: D","state":{"current":"D","queue":["E"],"visited":["A","B","C","D","E"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2},"edge":null},"note":"큐 앞에서 D 를 꺼내 확정한다(거리 2)."},{"step":19,"label":"간선 검사: D–B","state":{"current":"D","queue":["E"],"visited":["A","B","C","D","E"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2},"edge":["D","B"]},"note":"D 의 이웃 B 를 살펴본다."},{"step":20,"label":"건너뜀: B","state":{"current":"D","queue":["E"],"visited":["A","B","C","D","E"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2},"edge":["D","B"]},"note":"B 는 이미 방문함 → 무시."},{"step":21,"label":"간선 검사: D–C","state":{"current":"D","queue":["E"],"visited":["A","B","C","D","E"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2},"edge":["D","C"]},"note":"D 의 이웃 C 를 살펴본다."},{"step":22,"label":"건너뜀: C","state":{"current":"D","queue":["E"],"visited":["A","B","C","D","E"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2},"edge":["D","C"]},"note":"C 는 이미 방문함 → 무시."},{"step":23,"label":"간선 검사: D–F","state":{"current":"D","queue":["E"],"visited":["A","B","C","D","E"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2},"edge":["D","F"]},"note":"D 의 이웃 F 를 살펴본다."},{"step":24,"label":"발견: F","state":{"current":"D","queue":["E","F"],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["D","F"]},"note":"F 는 처음 본다 → 거리 3, 큐에 추가."},{"step":25,"label":"방문: E","state":{"current":"E","queue":["F"],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":null},"note":"큐 앞에서 E 를 꺼내 확정한다(거리 2)."},{"step":26,"label":"간선 검사: E–C","state":{"current":"E","queue":["F"],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["E","C"]},"note":"E 의 이웃 C 를 살펴본다."},{"step":27,"label":"건너뜀: C","state":{"current":"E","queue":["F"],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["E","C"]},"note":"C 는 이미 방문함 → 무시."},{"step":28,"label":"간선 검사: E–F","state":{"current":"E","queue":["F"],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["E","F"]},"note":"E 의 이웃 F 를 살펴본다."},{"step":29,"label":"건너뜀: F","state":{"current":"E","queue":["F"],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["E","F"]},"note":"F 는 이미 방문함 → 무시."},{"step":30,"label":"방문: F","state":{"current":"F","queue":[],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":null},"note":"큐 앞에서 F 를 꺼내 확정한다(거리 3)."},{"step":31,"label":"간선 검사: F–D","state":{"current":"F","queue":[],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["F","D"]},"note":"F 의 이웃 D 를 살펴본다."},{"step":32,"label":"건너뜀: D","state":{"current":"F","queue":[],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["F","D"]},"note":"D 는 이미 방문함 → 무시."},{"step":33,"label":"간선 검사: F–E","state":{"current":"F","queue":[],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["F","E"]},"note":"F 의 이웃 E 를 살펴본다."},{"step":34,"label":"건너뜀: E","state":{"current":"F","queue":[],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["F","E"]},"note":"E 는 이미 방문함 → 무시."},{"step":35,"label":"간선 검사: F–G","state":{"current":"F","queue":[],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["F","G"]},"note":"F 의 이웃 G 를 살펴본다."},{"step":36,"label":"발견: G","state":{"current":"F","queue":["G"],"visited":["A","B","C","D","E","F","G"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3,"G":4},"edge":["F","G"]},"note":"G 는 처음 본다 → 거리 4, 큐에 추가."},{"step":37,"label":"방문: G","state":{"current":"G","queue":[],"visited":["A","B","C","D","E","F","G"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3,"G":4},"edge":null},"note":"큐 앞에서 G 를 꺼내 확정한다(거리 4)."},{"step":38,"label":"간선 검사: G–F","state":{"current":"G","queue":[],"visited":["A","B","C","D","E","F","G"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3,"G":4},"edge":["G","F"]},"note":"G 의 이웃 F 를 살펴본다."},{"step":39,"label":"건너뜀: F","state":{"current":"G","queue":[],"visited":["A","B","C","D","E","F","G"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3,"G":4},"edge":["G","F"]},"note":"F 는 이미 방문함 → 무시."},{"step":40,"label":"완료","state":{"current":null,"queue":[],"visited":["A","B","C","D","E","F","G"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3,"G":4},"edge":null},"note":"큐가 비었다. 모든 노드의 최단 거리(간선 수)를 확정."}]</script>
<script>
// ── 월드/그래프 ──
const NODES={A:[300,250],B:[720,150],C:[300,650],D:[790,520],E:[380,950],F:[900,880],G:[1360,820]};
const EDGES=[["A","B"],["A","C"],["B","D"],["C","D"],["C","E"],["D","F"],["E","F"],["F","G"]];
const ADJ={}; for(const n in NODES) ADJ[n]=[];
for(const [u,v] of EDGES){ ADJ[u].push(v); ADJ[v].push(u); }
const WORLD={w:1600,h:1120}, R=44;

let TRACE=[]; try{ const t=document.getElementById('trace-data').textContent.trim();
  TRACE=(t&&!t.includes('__TRACE_'+'JSON__'))?JSON.parse(t):[]; }catch(e){}

const $=id=>document.getElementById(id);
const c=$('c'),ctx=c.getContext('2d'),mini=$('mini'),mctx=mini.getContext('2d');
let cam={x:0,y:0}, avatar={x:300,y:400,dx:0,dy:1}, guide={x:360,y:430}, keys={};
let idx=0, playing=false, playAcc=0, ripples=[], roam=new Set(), bubble={text:'',t:9}, lastComment=-1;
let last=performance.now();

function fit(cv){ const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
  cv.width=Math.max(1,r.width*d); cv.height=Math.max(1,r.height*d);
  cv.getContext('2d').setTransform(d,0,0,d,0,0); return {w:r.width,h:r.height}; }
let view=fit(c); fit(mini);
addEventListener('resize',()=>{ view=fit(c); fit(mini); });

const gv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#888';
const COL={current:gv('--current'),queued:gv('--queued'),done:gv('--done'),undisc:gv('--undisc')};
function snap(){ return TRACE[idx]||{state:{visited:[],queue:[],dist:{},current:null,edge:null},label:'',note:''}; }
function nodeState(n,o){ const s=o.state;
  if(n===s.current)return'current'; if(s.queue.includes(n))return'queued';
  if(s.visited.includes(n))return'done'; return'undisc'; }
const known=(n,o)=>roam.has(n)||nodeState(n,o)!=='undisc';
function nearest(){ let best=null,bd=1e9; for(const n in NODES){ const p=NODES[n];
  const d=Math.hypot(p[0]-avatar.x,p[1]-avatar.y); if(d<bd){bd=d;best=n;} } return best; }

// ── 입력 ──
addEventListener('keydown',e=>{
  if(document.activeElement===$('q')) return;           // 채팅 입력 중엔 이동 금지
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if(k===' '){ togglePlay(); return; }
  if(k==='['){ setIdx(idx-1); return; } if(k===']'){ setIdx(idx+1); return; }
  if(k==='r'){ avatar.x=300;avatar.y=400;roam.clear();setIdx(0); return; }
  keys[k]=true;
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
$('play').onclick=togglePlay; $('stepb').onclick=()=>setIdx(idx-1); $('stepf').onclick=()=>setIdx(idx+1);
$('slider').addEventListener('input',()=>setIdx(+$('slider').value));
function togglePlay(){ if(!TRACE.length)return; playing=!playing;
  if(playing&&idx>=TRACE.length-1) setIdx(0); $('play').textContent=playing?'⏸ 일시정지':'▶ 탐색 재생'; }

function setIdx(i){ if(!TRACE.length)return;
  const prev=snap().state.current; idx=Math.max(0,Math.min(TRACE.length-1,i)); const s=snap();
  $('slider').max=TRACE.length-1; $('slider').value=idx; $('counter').textContent=`${idx+1} / ${TRACE.length}`;
  $('label').textContent=s.label||'—'; $('note').textContent=s.note||'';
  if(s.state.current&&s.state.current!==prev) ripples.push({x:NODES[s.state.current][0],y:NODES[s.state.current][1],t:0});
  maybeComment(s);
}

// ── 거주 가이드 "루미" ──
function say(text,me=false){ const d=document.createElement('div'); d.className='msg '+(me?'me':'guide');
  d.textContent=text; $('log').appendChild(d); $('log').scrollTop=$('log').scrollHeight;
  if(!me){ bubble={text,t:0}; } }

function maybeComment(s){ if(idx===lastComment) return; lastComment=idx;
  const L=s.label||'';
  if(L.startsWith('초기화')) say('출발! 시작점 A를 큐에 넣었어. 여기서부터 물결처럼 가까운 곳부터 퍼질 거야. 🌊');
  else if(L.startsWith('방문')){ const n=s.state.current; say(`이제 ${n}를 확정했어(거리 ${s.state.dist[n]}). ${n}의 이웃들을 둘러볼 차례야.`); }
  else if(L.startsWith('완료')) say('탐색 끝! 모든 도달 가능한 장소의 최단 거리가 정해졌어. 이제 지도를 마음껏 돌아다녀도 돼. 🎉');
}

// ── 대화 엔진 (문맥 이해 + 의도 매칭) ──
const KOR={current:'현재 방문 중',queued:'큐에서 대기 중',done:'확정됨',undisc:'아직 미발견(안개)'};
const INTENTS=[
  { k:['안녕','하이','도움','헬프','help','뭐 물','뭘 물','사용법'],
    a:()=>'안녕! 나는 이 세계의 거주 가이드 루미야. 지금 무슨 일이 벌어지는지, BFS가 뭔지, 왜 이 순서로 가는지 물어봐. 아래 칩을 눌러도 되고, 아바타로 날 데리고 세계를 돌아다녀도 좋아.' },
  { k:['지금','무슨 일','뭐 해','뭐하','여기 무','상황','현재'],
    a:s=>{ const cur=s.state.current; if(cur) return `지금은 "${s.label}" 단계야. ${s.note||''} 파란 장소(${cur})가 내가 지금 서 있는 곳이고, 주황은 큐에서 차례를 기다리는 곳이야.`;
      return `지금은 "${s.label}" 단계야. ${s.note||''} 큐: [${s.state.queue.join(', ')||'비어있음'}].`; } },
  { k:['bfs','너비','탐색이 뭐','탐색 뭐','알고리즘'],
    a:()=>'BFS(너비 우선 탐색)는 시작점에서 가까운 곳부터 물결처럼 퍼지며 도는 방법이야. 큐(줄)에 넣은 순서대로 방문하기 때문에, 모든 장소까지의 "최단 거리(건너는 길의 수)"를 구할 수 있어.' },
  { k:['왜','순서','먼저','큐가 뭐','큐 뭐','queue','줄'],
    a:s=>`큐는 먼저 들어온 게 먼저 나가(FIFO, 줄서기와 같아). 그래서 큐 맨 앞부터 방문해. 지금 큐는 [${s.state.queue.join(', ')||'비어있음'}] 이고, 맨 앞 ${s.state.queue[0]||'(없음)'}가 다음 차례야. 이 "먼저 들어온 순서"가 곧 거리가 가까운 순서라서 최단 거리가 보장돼.` },
  { k:['거리','d=','얼마나','최단','distance'],
    a:s=>{ const n=nearest(); const d=s.state.dist[n]; return `거리 d는 시작점 A에서 그 장소까지 최소 몇 개의 길을 건너야 하는지야. 지금 너와 가장 가까운 장소는 ${n}${d===undefined?' (아직 미발견이라 거리 미정)':`, d=${d}`}.`; } },
  { k:['다음','이후','이제 뭐','앞으로'],
    a:s=>{ const nx=TRACE[idx+1]; return nx?`다음엔 "${nx.label}" 이 일어나. 미리 보고 싶으면 [ ] 로 한 스텝씩 넘겨봐.`:'지금이 마지막 단계야. 탐색이 끝났어.'; } },
  { k:['여기','이 장소','이곳','노드','이 노드','장소가'],
    a:s=>{ const n=nearest(); const st=nodeState(n,s); const d=s.state.dist[n];
      return `가장 가까운 장소는 ${n}야. 상태: ${KOR[st]}. ${d!==undefined?`거리 d=${d}. `:''}이웃: ${ADJ[n].join(', ')}. 아바타로 다가가면 안개가 걷혀.`; } },
  { k:['안개','미발견','흐릿','fog','안 보'],
    a:()=>'안개 낀 곳은 아직 탐색이 닿지 않은 미발견 장소야. 네가 아바타로 다가가거나, 탐색(BFS)이 그곳에 도달하면 걷혀.' },
  { k:['끝','목표','완료','언제 끝','goal'],
    a:()=>'큐가 완전히 빌 때까지 반복하면, 시작점에서 도달할 수 있는 모든 장소의 최단 거리가 정해져. 그게 BFS의 목표야.' },
  { k:['너 누구','루미','가이드가','정체'],
    a:()=>'나는 루미, 이 세계에 사는 가이드야. 문서를 읽어주는 대신, 너와 같은 세계에 함께 있으면서 지금 벌어지는 일을 곁에서 설명해줘.' },
];
function answer(text){ const s=snap(); const t=text.toLowerCase();
  for(const it of INTENTS){ if(it.k.some(kw=>t.includes(kw))) return it.a(s); }
  return `음, 그건 내가 딱 답하긴 어렵네. 대신 이런 걸 물어봐 — "지금 무슨 일이야?", "BFS가 뭐야?", "왜 이 순서로 가?", "거리가 뭐야?", "여긴 어디야?"`; }

function ask(text){ text=text.trim(); if(!text) return; say(text,true); setTimeout(()=>say(answer(text)),160); }
$('form').addEventListener('submit',e=>{ e.preventDefault(); ask($('q').value); $('q').value=''; });
const CHIPS=['지금 무슨 일이야?','BFS가 뭐야?','왜 이 순서로 가?','거리가 뭐야?','여긴 어디야?','다음엔 뭐가 일어나?'];
CHIPS.forEach(t=>{ const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=t;
  b.onclick=()=>ask(t); $('chips').appendChild(b); });

// ── 루프 ──
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
  let vx=0,vy=0;
  if(keys['w']||keys['arrowup'])vy--; if(keys['s']||keys['arrowdown'])vy++;
  if(keys['a']||keys['arrowleft'])vx--; if(keys['d']||keys['arrowright'])vx++;
  if(vx||vy){ const l=Math.hypot(vx,vy); vx/=l;vy/=l; avatar.dx=vx;avatar.dy=vy;
    avatar.x=clamp(avatar.x+vx*320*dt,20,WORLD.w-20); avatar.y=clamp(avatar.y+vy*320*dt,20,WORLD.h-20); }
  // 루미는 아바타를 부드럽게 따라옴
  const gx=avatar.x-54, gy=avatar.y-46; guide.x+=(gx-guide.x)*Math.min(1,dt*3); guide.y+=(gy-guide.y)*Math.min(1,dt*3);
  for(const n in NODES){ const p=NODES[n]; if(Math.hypot(p[0]-avatar.x,p[1]-avatar.y)<R+34) roam.add(n); }
  cam.x=clamp(avatar.x-view.w/2,0,Math.max(0,WORLD.w-view.w)); cam.y=clamp(avatar.y-view.h/2,0,Math.max(0,WORLD.h-view.h));
  if(playing){ playAcc+=dt; if(playAcc>=0.7){ playAcc=0;
    if(idx>=TRACE.length-1){ playing=false; $('play').textContent='▶ 탐색 재생'; } else setIdx(idx+1); } }
  ripples.forEach(r=>r.t+=dt); ripples=ripples.filter(r=>r.t<1.1); bubble.t+=dt;
  render(); requestAnimationFrame(loop);
}
function render(){ const s=snap(); ctx.clearRect(0,0,view.w,view.h); ctx.save(); ctx.translate(-cam.x,-cam.y);
  ctx.fillStyle=gv('--terrain-a'); ctx.fillRect(0,0,WORLD.w,WORLD.h);
  ctx.strokeStyle=gv('--grid'); ctx.globalAlpha=.5; ctx.lineWidth=1;
  for(let x=0;x<=WORLD.w;x+=80){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD.h);ctx.stroke(); }
  for(let y=0;y<=WORLD.h;y+=80){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD.w,y);ctx.stroke(); }
  ctx.globalAlpha=1;
  for(const [u,v] of EDGES){ const a=NODES[u],b=NODES[v];
    const hot=s.state.edge&&((s.state.edge[0]===u&&s.state.edge[1]===v)||(s.state.edge[0]===v&&s.state.edge[1]===u));
    const kn=known(u,s)&&known(v,s);
    ctx.strokeStyle=hot?gv('--path-hot'):gv('--path'); ctx.globalAlpha=hot?1:(kn?.9:.28);
    ctx.lineWidth=hot?8:5; ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke(); }
  ctx.globalAlpha=1;
  for(const r of ripples){ const e=1-r.t/1.1; ctx.strokeStyle=gv('--current'); ctx.globalAlpha=e*.5; ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(r.x,r.y,R+r.t*120,0,7);ctx.stroke(); } ctx.globalAlpha=1;
  for(const n in NODES) drawPlace(n,s);
  drawGuide(); drawAvatar();
  ctx.restore(); drawMini(s);
}
function drawPlace(n,s){ const [x,y]=NODES[n],st=nodeState(n,s),kn=known(n,s);
  ctx.globalAlpha=kn?1:.4; if(st==='current'){ ctx.shadowColor=COL[st]; ctx.shadowBlur=30; }
  ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fillStyle=COL[st];ctx.fill();ctx.shadowBlur=0;
  ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.25)';ctx.stroke();
  ctx.globalAlpha=1; ctx.fillStyle=kn?'#fff':'rgba(230,237,245,.5)';
  ctx.font='700 22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(kn?n:'?',x,y);
  const d=s.state.dist[n]; ctx.font='12px sans-serif';ctx.fillStyle='rgba(230,237,245,.8)';
  ctx.fillText(d===undefined?'':`d=${d}`,x,y+R+14); }
function drawAvatar(){ const {x,y,dx,dy}=avatar; ctx.save();ctx.translate(x,y);
  ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.fillStyle=gv('--avatar');ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
  const a=Math.atan2(dy,dx); ctx.beginPath();ctx.moveTo(Math.cos(a)*10,Math.sin(a)*10);
  ctx.lineTo(Math.cos(a)*26,Math.sin(a)*26);ctx.strokeStyle=gv('--avatar');ctx.lineWidth=5;ctx.stroke(); ctx.restore(); }
function drawGuide(){ const {x,y}=guide; ctx.save();ctx.translate(x,y);
  ctx.shadowColor=gv('--guide');ctx.shadowBlur=16;
  ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fillStyle=gv('--guide');ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#06323b'; ctx.beginPath();ctx.arc(-4,-2,2.4,0,7);ctx.arc(4,-2,2.4,0,7);ctx.fill(); // 눈
  // 말풍선(짧게)
  if(bubble.text&&bubble.t<5){ const short=bubble.text.length>22?bubble.text.slice(0,22)+'…':bubble.text;
    ctx.font='12px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
    const w=ctx.measureText(short).width+16; ctx.globalAlpha=Math.max(0,1-(bubble.t-3.5)/1.5);
    ctx.fillStyle='rgba(6,40,50,.95)';roundRect(18,-34,w,24,7);ctx.fill();
    ctx.strokeStyle=gv('--guide');ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#d6faff';ctx.fillText(short,26,-22); ctx.globalAlpha=1; }
  ctx.restore(); }
function roundRect(x,y,w,h,r){ ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath(); }
function drawMini(s){ const W=mini.getBoundingClientRect().width,H=mini.getBoundingClientRect().height;
  mctx.clearRect(0,0,W,H); const sx=W/WORLD.w,sy=H/WORLD.h;
  mctx.strokeStyle=gv('--path');mctx.globalAlpha=.6;mctx.lineWidth=1;
  for(const [u,v] of EDGES){ const a=NODES[u],b=NODES[v]; mctx.beginPath();mctx.moveTo(a[0]*sx,a[1]*sy);mctx.lineTo(b[0]*sx,b[1]*sy);mctx.stroke(); }
  mctx.globalAlpha=1;
  for(const n in NODES){ const p=NODES[n]; mctx.fillStyle=COL[nodeState(n,s)]; mctx.beginPath();mctx.arc(p[0]*sx,p[1]*sy,4,0,7);mctx.fill(); }
  mctx.fillStyle=gv('--guide');mctx.beginPath();mctx.arc(guide.x*sx,guide.y*sy,3,0,7);mctx.fill();
  mctx.fillStyle=gv('--avatar');mctx.beginPath();mctx.arc(avatar.x*sx,avatar.y*sy,3.5,0,7);mctx.fill();
  mctx.strokeStyle='rgba(255,255,255,.5)';mctx.strokeRect(cam.x*sx,cam.y*sy,view.w*sx,view.h*sy); }

// 시작
if(TRACE.length){ setIdx(0); say('반가워! 나는 루미야. 이 세계를 함께 돌아다니며 BFS가 어떻게 퍼지는지 알려줄게. 궁금하면 아래 칩을 누르거나 말을 걸어줘. ▶ 로 탐색을 재생해봐!'); }
else { $('label').textContent='trace 없음'; }
requestAnimationFrame(loop);
</script>
</body>
