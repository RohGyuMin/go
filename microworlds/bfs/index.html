<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Micro World — BFS 타임라인 디버거</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280;
    --panel: #f6f7f9; --border: #e2e5ea;
    --edge: #c4c9d4; --edge-hot: #2563eb;
    --undisc: #cbd2dc; --queued: #f59e0b; --current: #2563eb; --done: #10b981;
    --chip: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --fg: #e6e8ec; --muted: #9aa3b2;
      --panel: #171a21; --border: #262b36;
      --edge: #3a4150; --edge-hot: #60a5fa;
      --undisc: #3a4150; --queued: #f59e0b; --current: #3b82f6; --done: #10b981;
      --chip: #1f2430;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 17px; margin: 0; }
  .muted { color: var(--muted); }
  .wrap { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(240px, 1fr); gap: 16px; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  svg { width: 100%; height: auto; display: block; }
  .node-label { font-weight: 700; fill: #fff; font-size: 15px; }
  .node-dist { font-size: 10px; fill: var(--fg); }
  .bar { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; }
  input[type=range] { flex: 1; accent-color: var(--current); }
  button { font: inherit; padding: 5px 12px; border: 1px solid var(--border); background: var(--chip);
           color: var(--fg); border-radius: 8px; cursor: pointer; }
  button:hover { border-color: var(--current); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; min-height: 30px; }
  .chip { padding: 3px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--chip); font-weight: 600; }
  .chip.head { outline: 2px solid var(--current); }
  .dist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px,1fr)); gap: 6px; }
  .dist-cell { text-align: center; border: 1px solid var(--border); border-radius: 8px; padding: 4px; background: var(--chip); }
  .dist-cell b { display: block; font-size: 15px; }
  .dist-cell.inf { opacity: .45; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
  .note { margin-top: 10px; padding: 9px 12px; border-left: 3px solid var(--current); background: var(--chip); border-radius: 4px; }
  .step-label { font-weight: 700; }
  @keyframes pulse { 0%,100% { r: 30; opacity: .35 } 50% { r: 36; opacity: .12 } }
</style>
</head>
<body>
<header>
  <h1>🌍 Micro World — BFS 타임라인 디버거</h1>
  <span class="muted">슬라이더를 드래그(또는 ← → , space)하며 큐·방문·거리가 어떻게 변하는지 관찰하세요</span>
</header>

<div class="wrap">
  <div class="card">
    <svg id="graph" viewBox="0 0 520 420" role="img" aria-label="BFS 그래프"></svg>
    <div class="legend">
      <span><span class="dot" style="background:var(--undisc)"></span>미발견</span>
      <span><span class="dot" style="background:var(--queued)"></span>큐 대기</span>
      <span><span class="dot" style="background:var(--current)"></span>현재 방문</span>
      <span><span class="dot" style="background:var(--done)"></span>확정</span>
    </div>
  </div>

  <div class="card">
    <h2>현재 스텝</h2>
    <div><span class="step-label" id="label">—</span></div>
    <div class="note" id="note">—</div>

    <h2 style="margin-top:16px">큐 (앞 → 뒤)</h2>
    <div class="chips" id="queue"></div>

    <h2 style="margin-top:16px">거리 (시작점 A로부터)</h2>
    <div class="dist-grid" id="dist"></div>
  </div>
</div>

<div class="bar">
  <button id="prev" title="이전 (←)">◀</button>
  <button id="play" title="재생/정지 (space)">▶ 재생</button>
  <button id="next" title="다음 (→)">▶</button>
  <input type="range" id="slider" min="0" value="0" />
  <span id="counter" class="muted">0 / 0</span>
</div>

<!-- 추적 데이터: trace_bfs.py 가 만든 스냅샷을 인라인 임베드 (더블클릭으로 열어도 동작).
     /micro-world 파이프라인에선 외부 trace.json 을 로드하는 방식도 지원 (아래 boot() 참고). -->
<script type="application/json" id="trace-data">[{"step":0,"label":"초기화","state":{"current":null,"queue":["A"],"visited":["A"],"dist":{"A":0},"edge":null},"note":"시작 노드 A 를 큐에 넣고 거리 0."},{"step":1,"label":"방문: A","state":{"current":"A","queue":[],"visited":["A"],"dist":{"A":0},"edge":null},"note":"큐 앞에서 A 를 꺼내 확정한다(거리 0)."},{"step":2,"label":"간선 검사: A–B","state":{"current":"A","queue":[],"visited":["A"],"dist":{"A":0},"edge":["A","B"]},"note":"A 의 이웃 B 를 살펴본다."},{"step":3,"label":"발견: B","state":{"current":"A","queue":["B"],"visited":["A","B"],"dist":{"A":0,"B":1},"edge":["A","B"]},"note":"B 는 처음 본다 → 거리 1, 큐에 추가."},{"step":4,"label":"간선 검사: A–C","state":{"current":"A","queue":["B"],"visited":["A","B"],"dist":{"A":0,"B":1},"edge":["A","C"]},"note":"A 의 이웃 C 를 살펴본다."},{"step":5,"label":"발견: C","state":{"current":"A","queue":["B","C"],"visited":["A","B","C"],"dist":{"A":0,"B":1,"C":1},"edge":["A","C"]},"note":"C 는 처음 본다 → 거리 1, 큐에 추가."},{"step":6,"label":"방문: B","state":{"current":"B","queue":["C"],"visited":["A","B","C"],"dist":{"A":0,"B":1,"C":1},"edge":null},"note":"큐 앞에서 B 를 꺼내 확정한다(거리 1)."},{"step":7,"label":"간선 검사: B–A","state":{"current":"B","queue":["C"],"visited":["A","B","C"],"dist":{"A":0,"B":1,"C":1},"edge":["B","A"]},"note":"B 의 이웃 A 를 살펴본다."},{"step":8,"label":"건너뜀: A","state":{"current":"B","queue":["C"],"visited":["A","B","C"],"dist":{"A":0,"B":1,"C":1},"edge":["B","A"]},"note":"A 는 이미 방문함 → 무시."},{"step":9,"label":"간선 검사: B–D","state":{"current":"B","queue":["C"],"visited":["A","B","C"],"dist":{"A":0,"B":1,"C":1},"edge":["B","D"]},"note":"B 의 이웃 D 를 살펴본다."},{"step":10,"label":"발견: D","state":{"current":"B","queue":["C","D"],"visited":["A","B","C","D"],"dist":{"A":0,"B":1,"C":1,"D":2},"edge":["B","D"]},"note":"D 는 처음 본다 → 거리 2, 큐에 추가."},{"step":11,"label":"방문: C","state":{"current":"C","queue":["D"],"visited":["A","B","C","D"],"dist":{"A":0,"B":1,"C":1,"D":2},"edge":null},"note":"큐 앞에서 C 를 꺼내 확정한다(거리 1)."},{"step":12,"label":"간선 검사: C–A","state":{"current":"C","queue":["D"],"visited":["A","B","C","D"],"dist":{"A":0,"B":1,"C":1,"D":2},"edge":["C","A"]},"note":"C 의 이웃 A 를 살펴본다."},{"step":13,"label":"건너뜀: A","state":{"current":"C","queue":["D"],"visited":["A","B","C","D"],"dist":{"A":0,"B":1,"C":1,"D":2},"edge":["C","A"]},"note":"A 는 이미 방문함 → 무시."},{"step":14,"label":"간선 검사: C–D","state":{"current":"C","queue":["D"],"visited":["A","B","C","D"],"dist":{"A":0,"B":1,"C":1,"D":2},"edge":["C","D"]},"note":"C 의 이웃 D 를 살펴본다."},{"step":15,"label":"건너뜀: D","state":{"current":"C","queue":["D"],"visited":["A","B","C","D"],"dist":{"A":0,"B":1,"C":1,"D":2},"edge":["C","D"]},"note":"D 는 이미 방문함 → 무시."},{"step":16,"label":"간선 검사: C–E","state":{"current":"C","queue":["D"],"visited":["A","B","C","D"],"dist":{"A":0,"B":1,"C":1,"D":2},"edge":["C","E"]},"note":"C 의 이웃 E 를 살펴본다."},{"step":17,"label":"발견: E","state":{"current":"C","queue":["D","E"],"visited":["A","B","C","D","E"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2},"edge":["C","E"]},"note":"E 는 처음 본다 → 거리 2, 큐에 추가."},{"step":18,"label":"방문: D","state":{"current":"D","queue":["E"],"visited":["A","B","C","D","E"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2},"edge":null},"note":"큐 앞에서 D 를 꺼내 확정한다(거리 2)."},{"step":19,"label":"간선 검사: D–B","state":{"current":"D","queue":["E"],"visited":["A","B","C","D","E"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2},"edge":["D","B"]},"note":"D 의 이웃 B 를 살펴본다."},{"step":20,"label":"건너뜀: B","state":{"current":"D","queue":["E"],"visited":["A","B","C","D","E"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2},"edge":["D","B"]},"note":"B 는 이미 방문함 → 무시."},{"step":21,"label":"간선 검사: D–C","state":{"current":"D","queue":["E"],"visited":["A","B","C","D","E"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2},"edge":["D","C"]},"note":"D 의 이웃 C 를 살펴본다."},{"step":22,"label":"건너뜀: C","state":{"current":"D","queue":["E"],"visited":["A","B","C","D","E"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2},"edge":["D","C"]},"note":"C 는 이미 방문함 → 무시."},{"step":23,"label":"간선 검사: D–F","state":{"current":"D","queue":["E"],"visited":["A","B","C","D","E"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2},"edge":["D","F"]},"note":"D 의 이웃 F 를 살펴본다."},{"step":24,"label":"발견: F","state":{"current":"D","queue":["E","F"],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["D","F"]},"note":"F 는 처음 본다 → 거리 3, 큐에 추가."},{"step":25,"label":"방문: E","state":{"current":"E","queue":["F"],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":null},"note":"큐 앞에서 E 를 꺼내 확정한다(거리 2)."},{"step":26,"label":"간선 검사: E–C","state":{"current":"E","queue":["F"],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["E","C"]},"note":"E 의 이웃 C 를 살펴본다."},{"step":27,"label":"건너뜀: C","state":{"current":"E","queue":["F"],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["E","C"]},"note":"C 는 이미 방문함 → 무시."},{"step":28,"label":"간선 검사: E–F","state":{"current":"E","queue":["F"],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["E","F"]},"note":"E 의 이웃 F 를 살펴본다."},{"step":29,"label":"건너뜀: F","state":{"current":"E","queue":["F"],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["E","F"]},"note":"F 는 이미 방문함 → 무시."},{"step":30,"label":"방문: F","state":{"current":"F","queue":[],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":null},"note":"큐 앞에서 F 를 꺼내 확정한다(거리 3)."},{"step":31,"label":"간선 검사: F–D","state":{"current":"F","queue":[],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["F","D"]},"note":"F 의 이웃 D 를 살펴본다."},{"step":32,"label":"건너뜀: D","state":{"current":"F","queue":[],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["F","D"]},"note":"D 는 이미 방문함 → 무시."},{"step":33,"label":"간선 검사: F–E","state":{"current":"F","queue":[],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["F","E"]},"note":"F 의 이웃 E 를 살펴본다."},{"step":34,"label":"건너뜀: E","state":{"current":"F","queue":[],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["F","E"]},"note":"E 는 이미 방문함 → 무시."},{"step":35,"label":"간선 검사: F–G","state":{"current":"F","queue":[],"visited":["A","B","C","D","E","F"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3},"edge":["F","G"]},"note":"F 의 이웃 G 를 살펴본다."},{"step":36,"label":"발견: G","state":{"current":"F","queue":["G"],"visited":["A","B","C","D","E","F","G"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3,"G":4},"edge":["F","G"]},"note":"G 는 처음 본다 → 거리 4, 큐에 추가."},{"step":37,"label":"방문: G","state":{"current":"G","queue":[],"visited":["A","B","C","D","E","F","G"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3,"G":4},"edge":null},"note":"큐 앞에서 G 를 꺼내 확정한다(거리 4)."},{"step":38,"label":"간선 검사: G–F","state":{"current":"G","queue":[],"visited":["A","B","C","D","E","F","G"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3,"G":4},"edge":["G","F"]},"note":"G 의 이웃 F 를 살펴본다."},{"step":39,"label":"건너뜀: F","state":{"current":"G","queue":[],"visited":["A","B","C","D","E","F","G"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3,"G":4},"edge":["G","F"]},"note":"F 는 이미 방문함 → 무시."},{"step":40,"label":"완료","state":{"current":null,"queue":[],"visited":["A","B","C","D","E","F","G"],"dist":{"A":0,"B":1,"C":1,"D":2,"E":2,"F":3,"G":4},"edge":null},"note":"큐가 비었다. 모든 노드의 최단 거리(간선 수)를 확정."}]</script>

<script>
const NODES = {
  A: [90, 80], B: [250, 55], C: [95, 230], D: [275, 175],
  E: [130, 360], F: [330, 320], G: [470, 300]
};
const EDGES = [["A","B"],["A","C"],["B","D"],["C","D"],["C","E"],["D","F"],["E","F"],["F","G"]];

let trace = [], i = 0, timer = null;
const $ = (id) => document.getElementById(id);
const eqEdge = (e, u, v) => e && ((e[0]===u&&e[1]===v)||(e[0]===v&&e[1]===u));

async function boot() {
  const inline = $('trace-data').textContent.trim();
  try {
    if (inline && inline !== '__TRACE_' + 'JSON__') trace = JSON.parse(inline);
    else { const r = await fetch('./trace.json', {cache:'no-store'}); trace = await r.json(); }
  } catch (e) { document.body.insertAdjacentHTML('beforeend',
      '<p style="color:#e11">trace 를 불러오지 못했습니다. trace_bfs.py 로 trace.json 을 만들어 옆에 두세요.</p>'); return; }
  start();
}

function start() {
  drawStaticGraph();
  $('slider').max = trace.length - 1;
  $('slider').addEventListener('input', () => render(+$('slider').value));
  $('prev').onclick = () => render(i-1);
  $('next').onclick = () => render(i+1);
  $('play').onclick = togglePlay;
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') render(i-1);
    else if (e.key === 'ArrowRight') render(i+1);
    else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  });
  render(0);
}

function togglePlay() {
  if (timer) { clearInterval(timer); timer = null; $('play').textContent = '▶ 재생'; return; }
  if (i >= trace.length - 1) render(0);
  $('play').textContent = '⏸ 정지';
  timer = setInterval(() => { if (i >= trace.length-1) togglePlay(); else render(i+1); }, 650);
}

function drawStaticGraph() {
  const svg = $('graph');
  let s = '';
  for (const [u,v] of EDGES) {
    const [x1,y1] = NODES[u], [x2,y2] = NODES[v];
    s += `<line class="edge" data-u="${u}" data-v="${v}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
           stroke="var(--edge)" stroke-width="3" />`;
  }
  for (const n of Object.keys(NODES)) {
    const [x,y] = NODES[n];
    s += `<g data-node="${n}">
        <circle class="ring" cx="${x}" cy="${y}" r="30" fill="var(--current)" opacity="0" />
        <circle class="disc" cx="${x}" cy="${y}" r="24" fill="var(--undisc)" stroke="var(--border)" stroke-width="2" />
        <text class="node-label" x="${x}" y="${y+1}" text-anchor="middle" dominant-baseline="middle">${n}</text>
        <text class="node-dist" x="${x}" y="${y+38}" text-anchor="middle">·</text>
      </g>`;
  }
  svg.innerHTML = s;
}

function render(n) {
  i = Math.max(0, Math.min(trace.length-1, n));
  const snap = trace[i], st = snap.state;
  $('slider').value = i;
  $('counter').textContent = `${i+1} / ${trace.length}`;
  $('label').textContent = snap.label;
  $('note').textContent = '💬 ' + (snap.note || '');

  const queued = new Set(st.queue);
  // 노드 상태 갱신
  for (const n of Object.keys(NODES)) {
    const g = document.querySelector(`[data-node="${n}"]`);
    const disc = g.querySelector('.disc'), ring = g.querySelector('.ring'), dt = g.querySelector('.node-dist');
    let fill = 'var(--undisc)';
    const visited = st.visited.includes(n);
    if (n === st.current) fill = 'var(--current)';
    else if (queued.has(n)) fill = 'var(--queued)';
    else if (visited) fill = 'var(--done)';
    disc.setAttribute('fill', fill);
    ring.setAttribute('opacity', n === st.current ? '0.3' : '0');
    ring.style.animation = n === st.current ? 'pulse 1.2s ease-in-out infinite' : 'none';
    dt.textContent = (st.dist[n] === undefined) ? '∞' : `d=${st.dist[n]}`;
  }
  // 간선 강조 (지금 검사 중인 간선)
  document.querySelectorAll('.edge').forEach(l => {
    const hot = eqEdge(st.edge, l.dataset.u, l.dataset.v);
    l.setAttribute('stroke', hot ? 'var(--edge-hot)' : 'var(--edge)');
    l.setAttribute('stroke-width', hot ? '6' : '3');
  });
  // 큐 칩
  $('queue').innerHTML = st.queue.length
    ? st.queue.map((n,idx) => `<span class="chip ${idx===0?'head':''}">${n}</span>`).join('')
    : '<span class="muted">(비어 있음)</span>';
  // 거리 표
  $('dist').innerHTML = Object.keys(NODES).map(n => {
    const d = st.dist[n];
    return `<div class="dist-cell ${d===undefined?'inf':''}"><b>${n}</b>${d===undefined?'∞':d}</div>`;
  }).join('');
}

boot();
</script>
</body>
</html>
